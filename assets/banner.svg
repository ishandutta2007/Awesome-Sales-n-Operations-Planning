<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .pulse-circle {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      .flow-line {
        stroke-dasharray: 8 6;
        animation: dash 12s linear infinite;
      }
      .node-pulse {
        animation: scaleNode 2.5s ease-in-out infinite alternate;
        transform-origin: center;
      }
      .badge-glow {
        animation: badgePulse 4s ease-in-out infinite;
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -140;
        }
      }
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.98); }
        100% { opacity: 0.7; transform: scale(1.02); }
      }
      @keyframes scaleNode {
        0% { r: 5; opacity: 0.6; }
        100% { r: 9; opacity: 1; }
      }
      @keyframes badgePulse {
        0%, 100% { filter: drop-shadow(0 0 8px rgba(99, 102, 241, 0.4)); }
        50% { filter: drop-shadow(0 0 18px rgba(56, 189, 248, 0.7)); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1100" y1="0" x2="1100" y2="400" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
  </g>

  <!-- Glow effects -->
  <circle cx="220" cy="100" r="180" fill="url(#glowGrad)" class="pulse-circle" />
  <circle cx="1000" cy="280" r="220" fill="url(#glowGrad)" class="pulse-circle" style="animation-delay: -1.5s;" />

  <!-- Dynamic Planning Visualization (Right Panel) -->
  <g transform="translate(680, 55)">
    <rect x="0" y="0" width="465" height="290" rx="14" fill="#1e293b" fill-opacity="0.55" stroke="#334155" stroke-width="1.5" />
    
    <!-- Demand & Supply Splines -->
    <path d="M 30 200 Q 120 80, 230 140 T 435 70" fill="none" stroke="url(#accentGrad)" stroke-width="3.5" filter="url(#glow)" />
    <path d="M 30 170 Q 130 220, 230 120 T 435 110" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.85" />
    <path d="M 30 230 Q 150 180, 250 210 T 435 160" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.75" />

    <!-- Connected Pipeline -->
    <line x1="75" y1="75" x2="225" y2="75" stroke="#38bdf8" stroke-width="1.5" class="flow-line" />
    <line x1="225" y1="75" x2="385" y2="75" stroke="#818cf8" stroke-width="1.5" class="flow-line" />
    
    <!-- Stage 1: Demand Sensing -->
    <g transform="translate(75, 75)">
      <circle cx="0" cy="0" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      <circle cx="0" cy="0" r="7" fill="#38bdf8" class="node-pulse" />
      <text x="0" y="38" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">DEMAND</text>
    </g>

    <!-- Stage 2: S&OP / IBP Consensus -->
    <g transform="translate(225, 75)">
      <circle cx="0" cy="0" r="26" fill="#1e1b4b" stroke="#818cf8" stroke-width="2.5" filter="url(#nodeGlow)" />
      <circle cx="0" cy="0" r="9" fill="#c084fc" class="node-pulse" style="animation-delay: -0.8s;" />
      <text x="0" y="42" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">S&amp;OP / IBP</text>
    </g>

    <!-- Stage 3: Supply Balancing -->
    <g transform="translate(385, 75)">
      <circle cx="0" cy="0" r="22" fill="#064e3b" stroke="#10b981" stroke-width="2" />
      <circle cx="0" cy="0" r="7" fill="#10b981" class="node-pulse" style="animation-delay: -1.6s;" />
      <text x="0" y="38" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">SUPPLY</text>
    </g>

    <!-- Inventory Performance Metrics -->
    <g transform="translate(35, 185)">
      <rect x="0" y="40" width="16" height="30" rx="3" fill="#38bdf8" opacity="0.8" />
      <rect x="24" y="25" width="16" height="45" rx="3" fill="#818cf8" opacity="0.85" />
      <rect x="48" y="10" width="16" height="60" rx="3" fill="#c084fc" opacity="0.9" />
      <rect x="72" y="20" width="16" height="50" rx="3" fill="#10b981" opacity="0.85" />
      <text x="44" y="85" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Multi-Echelon Capacity</text>
    </g>

    <!-- Metrics Callout -->
    <g transform="translate(225, 185)">
      <rect x="0" y="10" width="205" height="68" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="14" y="32" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">⚡ Real-Time Consensus</text>
      <text x="14" y="52" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold">99.4% Forecast Precision</text>
      <text x="14" y="68" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">▲ +14% Service Level Optimization</text>
    </g>
  </g>

  <!-- Left Side: Header & Branding -->
  <g transform="translate(70, 75)">
    <g class="badge-glow">
      <rect x="0" y="0" width="310" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
      <circle cx="16" cy="16" r="5" fill="#38bdf8" />
      <text x="30" y="21" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">CURATED ECOSYSTEM 2026</text>
    </g>

    <text x="0" y="85" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5">
      Awesome Sales &amp; Operations
    </text>
    <text x="0" y="130" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5">
      Planning (S&amp;OP / IBP)
    </text>

    <text x="0" y="175" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">
      Enterprise SaaS Platforms • Open-Source APS &amp; Demand Solvers
    </text>
    <text x="0" y="200" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400">
      Multi-Echelon Inventory • Capacity Balancing • What-If Scenario Simulations
    </text>

    <!-- Category Pills -->
    <g transform="translate(0, 230)">
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="65" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🎯 Demand Sensing</text>

      <rect x="140" y="0" width="140" height="28" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="210" y="18" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚙️ Capacity Planning</text>

      <rect x="290" y="0" width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="355" y="18" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">📊 IBP Consensus</text>

      <rect x="430" y="0" width="110" height="28" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="485" y="18" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🧪 What-If AI</text>
    </g>
  </g>
</svg>